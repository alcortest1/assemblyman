assumptions:
- id: sr.s1.c4
  statement: >-
    Set shank and spring are undamaged, clean and free of burrs, mushrooming or chipping on
    the working face.
  reason: >-
    Implied by sheet's set selection step; a marred set face transfers defects to rivet heads.
    Needs SME confirmation of acceptance limit.
  resolve_by: Confirm with AIM before marking this pack reviewed.
- id: rm.s1.c4
  statement: >-
    Protruding shank length is sufficient to form a shop head of about 0.5D height and 1.5D
    width.
  reason: >-
    Shop head 0.5D/1.5D is the procedure sheet's figure alone; handbook extract states no
    protrusion value. Needs SME confirmation of pre-buck protrusion.
  resolve_by: Confirm with AIM before marking this pack reviewed.
- id: rr.s4.c5
  statement: >-
    The workpiece was backed/supported so the blow drove the shank out rather than deflecting
    the sheet.
  reason: >-
    Handbook p.4-85: 'When hand drilling thin or flexible parts, put a support (such as a
    block of wood) behind the part' — same principle applied to punching.
  resolve_by: Confirm with AIM before marking this pack reviewed.
- id: ev5
  statement: >-
    Shop head dimensions measured on every driven rivet — height and width recorded against
    the rivet shank diameter — plus recorded finished hole diameter and the gauge/alloy of
    doubler and filler stock.
  reason: Required as measurement, which a single photograph cannot evidence.
  resolve_by: Decide the capture method with Alcor during pilot scoping.
open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  Does this practical require a flush patch (doubler plus filler, as the procedure sheet's
  fabrication steps assume) or a lap/scab patch? The handbook edge-distance and 1"/staggered
  1/2" spacing figures on p. 4-96 are stated for the lap patch and may not govern a flush
  patch layout.
- >-
  What skin thickness and alloy is the training coupon, and what rivet diameter, edge distance
  and pitch does that yield? Without these the layout criteria cannot be checked numerically.
- >-
  What tolerance band applies to the campus 0.5D/1.5D shop head figures — the sheet says 'preferred'
  but gives no accept/reject range.
- >-
  Is the source of the rivet count an SRM, AC 43.13-1 Figure 4-169, or an instructor-supplied
  value? The pack currently accepts 'the documented calculation'.
- >-
  Is the Remove the Rivet section graded on the same coupon as the installed patch, or on
  a separate practice piece? This changes whether a vacated hole in the finished patch is
  a defect or expected evidence.
- >-
  Are the 0.003-inch ream allowance and #40/#30 drill sizes campus practice or traceable to
  an SRM the student should cite?
