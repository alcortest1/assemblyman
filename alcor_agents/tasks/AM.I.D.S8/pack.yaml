photo_assessment:
  fit: High
  rationale: >-
    The campus rates this High because the graded object is a finished artifact whose most
    telling errors are geometric and stay visible after the fact: nut-behind-sleeve stacking
    order, sleeve orientation, a square burr-free cut, a nut drawn down square on the fitting,
    and — after disconnection — a continuous witness ring from the sleeve cutting edge and
    tube visibly projecting past the sleeve pilot. What a still cannot settle is everything
    defined by process or by thousandths: whether the tube was bottomed on the seat, whether
    threads were lubricated, the number of turns counted from the grip point ('when the tube
    no longer turns'), the 0.005"/0.015" pilot clearance, and whether the pilot moves axially.
    Note also that the presetting and inspection operations are not on the AIM procedure sheet,
    which ends at 'Deburr the tubing ends' — the standards below come verbatim from the handbook
    pages the sheet cites, but their inclusion as graded steps is provisional.
safety:
- >-
  Over-tightening flareless fitting may deform the tubing too much, causing line failure.
- Installation of sleeves without lubrication may cause stress cracks.
equipment:
- Rigid Tubing
- Cutting Tool
- Sand Paper
- Debur Tool
- Flareless Sleeve
- B-nut
- Mandrel
steps:
- id: ct.s1
  section: Cut the Tubing
  text: Measure needed length of tubing.
  checks:
  - id: ct.s1.c1
    statement: >-
      The marked length matches the length required for the assembly, including fitting engagement
      allowance.
    observable: measurement
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "Cut the tube to the correct length"; procedure sheet step 1 requires
      measuring needed length.
  - id: ct.s1.c2
    statement: >-
      The layout mark is a single crisp line encircling the tube perpendicular to its axis.
    observable: photo
    source: both
    origin: drafted
    note: >-
      Sheet note 1: "Align the marked line and sharp cutting wheel precisely"; handbook p.9-6
      "with the ends perfectly square."
  - id: ct.s1.c3
    statement: >-
      The required length is established from the applicable drawing, manual or routing data
      before marking.
    observable: document
    source: procedure sheet
    origin: drafted
    note: >-
      Before You Begin: "Use all relevant data... Maintenance, Overhaul, and Service Manuals."
  - id: ct.s1.c4
    statement: >-
      The scale is zeroed flush against the tube end with no slack or parallax when the mark
      is struck.
    observable: video
    source: procedure sheet
    origin: drafted
    note: >-
      Measuring technique implied by step 1; only observable while the measurement is being
      taken.
  error_modes:
  - id: ct.s1.e1
    statement: >-
      Tube marked short, so the finished tube cannot bottom firmly in the fitting seat.
    severity: critical
    origin: drafted
  - id: ct.s1.e2
    statement: >-
      Mark laid out at an angle or not carried around the tube, guaranteeing a non-square
      cut.
    severity: major
    origin: drafted
  - id: ct.s1.e3
    statement: >-
      Multiple or smeared trial marks left on the tube, obscuring the intended cut line.
    severity: minor
    origin: drafted
- id: ct.s2
  section: Cut the Tubing
  text: Cut the tubing.
  note_refs:
  - 1
  checks:
  - id: ct.s2.c1
    statement: >-
      The cut end is square to the tube axis within a squareness check against a machinist
      square.
    observable: measurement
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "Cut the tube to the correct length, with the ends perfectly square." Sheet
      states only "Cut the tubing."
  - id: ct.s2.c2
    statement: Finished tube length matches the length measured and marked in step 1.
    observable: measurement
    source: both
    origin: drafted
    note: >-
      Sheet: "Measure needed length of tubing"; handbook: "Cut the tube to the correct length."
  - id: ct.s2.c3
    statement: >-
      The tube at and near the cut shows no flattening, ovality or crush marks from the cutting
      wheel.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Sheet directs the wheel be tightened only "slightly snug" and re-tightened progressively,
      which prevents pinching the tube.
  - id: ct.s2.c4
    statement: >-
      The end is severed cleanly with no torn, ragged or partially broken-off metal or multiple
      off-track cut grooves.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Sheet: "Continue re-tightening and rotating the cutting tool until cleanly cut through
      tubing."
  error_modes:
  - id: ct.s2.e1
    statement: >-
      Cutting wheel over-tightened, ovalizing or partially collapsing the tube at the cut.
    severity: critical
    origin: drafted
  - id: ct.s2.e2
    statement: >-
      End cut noticeably out of square, so the tube cannot bottom squarely on the fitting
      seat.
    severity: critical
    origin: drafted
  - id: ct.s2.e3
    statement: >-
      Wheel wanders off the mark, leaving spiral or double cut tracks and a torn end.
    severity: major
    origin: drafted
  - id: ct.s2.e4
    statement: Cut to the wrong length relative to the mark.
    severity: minor
    origin: drafted
- id: ct.s3
  section: Cut the Tubing
  text: Deburr the tubing ends.
  note_refs:
  - 2
  - 3
  checks:
  - id: ct.s3.c1
    statement: >-
      Both the inside and outside edges of the tube end are free of raised burrs and ragged
      metal.
    observable: photo
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "Deburr the inside and outside of the tube"; sheet note 2 requires inside
      diameter smooth.
  - id: ct.s3.c2
    statement: >-
      The bore at the deburred end measures the original inside diameter, with no bell-mouthing
      or wall thinning.
    observable: measurement
    source: procedure sheet
    origin: drafted
    note: >-
      Sheet note 2: "check the inside diameter is smooth and the original size returned";
      handbook is silent on any dimension.
  - id: ct.s3.c3
    statement: >-
      The tube end remains perpendicular to the tube axis after deburring and sanding.
    observable: measurement
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook p.9-6: "Cut the tube to the correct length, with the ends perfectly square";
      squareness must survive deburring.
  - id: ct.s3.c4
    statement: >-
      No metal chips, swarf or abrasive grit remain inside the tube bore or on the end face.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Implied by sanding with lubricated paper and by contamination risk; handbook states
      no cleanliness requirement here.
  error_modes:
  - id: ct.s3.e1
    statement: >-
      Over-deburring bells or thins the tube end, so the sleeve cannot grip sound wall at
      presetting.
    severity: critical
    origin: drafted
  - id: ct.s3.e2
    statement: >-
      Abrasive grit or metal chips left in the bore and carried into the system.
    severity: critical
    origin: drafted
  - id: ct.s3.e3
    statement: >-
      Inside burr left in place, restricting flow and visible as a ragged lip in the bore.
    severity: major
    origin: drafted
  - id: ct.s3.e4
    statement: >-
      Outside edge left sharp or scratched by sandpaper, marring the sleeve seating area.
    severity: minor
    origin: drafted
- id: ps.s1
  section: Preset the Sleeve
  text: >-
    Slip the nut, then the sleeve, over the tube and lubricate the fitting and nut threads
    with hydraulic fluid.
  origin: drafted
  assumed: true
  note_refs:
  - 1
  checks:
  - id: ps.s1.c1
    statement: >-
      The nut is on the tube first, behind the sleeve, so the sleeve sits between the nut
      and the tube end.
    observable: photo
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "Slip the nut, then the sleeve, over the tube (step 1)"; procedure sheet
      states the same order.
  - id: ps.s1.c2
    statement: >-
      The sleeve is oriented with its cutting edge and pilot facing the tube end that will
      enter the fitting.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-8
    origin: drafted
    note: >-
      Figure 9-14 labels "Sleeve pilot"/"Sleeve cutting edge" toward the fitting; drafted
      supplemental step, needs subject-matter confirmation.
    assumed: true
  - id: ps.s1.c3
    statement: >-
      The tube end is cut square to the tube axis and free of burrs inside and outside before
      the nut and sleeve go on.
    observable: measurement
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "Cut the tube to the correct length, with the ends perfectly square.
      Deburr the inside and outside of the tube." Squareness needs a square/gauge.
  - id: ps.s1.c4
    statement: >-
      Hydraulic fluid is applied to the threads of both the fitting and the nut before assembly.
    observable: video
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "lubricate the threads of the fitting and nut with hydraulic fluid";
      sheet safety note warns dry sleeves cause stress cracks.
  error_modes:
  - id: ps.s1.e1
    statement: >-
      Sleeve slipped on backwards, cutting edge facing away from the fitting, so it cannot
      bite the tube.
    severity: critical
    origin: drafted
  - id: ps.s1.e2
    statement: >-
      Nut and fitting threads assembled dry, risking galling and stress cracking of the sleeve.
    severity: critical
    origin: drafted
  - id: ps.s1.e3
    statement: >-
      Sleeve installed before the nut, so the nut cannot be drawn onto the fitting.
    severity: major
    origin: drafted
  - id: ps.s1.e4
    statement: >-
      Nut and sleeve installed over an out-of-square or burred tube end, now hidden under
      the sleeve.
    severity: major
    origin: drafted
- id: ps.s2
  section: Preset the Sleeve
  text: >-
    Place the fitting in a vise and hold the tube firmly and squarely on the fitting seat
    so it bottoms in the fitting.
  origin: drafted
  assumed: true
  note_refs:
  - 2
  checks:
  - id: ps.s2.c1
    statement: >-
      The fitting body is clamped in the vise so it cannot rotate, with jaws off the threads
      and sealing cone.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "Place the fitting in a vise (step 2)"; the jaw-placement detail is inferred
      and this step is supplemental, so SME confirmation is needed.
    assumed: true
  - id: ps.s2.c2
    statement: >-
      The tube axis is coaxial with the fitting, not cocked or side-loaded, with the nut hand-started
      straight.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "hold the tubing firmly and squarely on the seat in the fitting"; step is
      supplemental and unreviewed by an SME.
    assumed: true
  - id: ps.s2.c3
    statement: >-
      The tube is bottomed firmly against the seat in the fitting before the nut is tightened.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "(The tube must bottom firmly in the fitting.)" Seating cannot be seen once
      assembled; supplemental step, needs SME confirmation.
    assumed: true
  - id: ps.s2.c4
    statement: >-
      The sleeve grip point is found by turning the tube back and forth while tightening until
      it no longer turns.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "slowly turn the tube back and forth while tightening the nut. When the tube
      no longer turns, the nut is ready for tightening."
    assumed: true
  error_modes:
  - id: ps.s2.e1
    statement: >-
      Nut tightened before the tube is bottomed on the seat, presetting the sleeve at the
      wrong location on the tube.
    severity: critical
    origin: drafted
  - id: ps.s2.e2
    statement: >-
      Tube held cocked in the fitting, so the sleeve cutting edge bites unevenly around the
      tube circumference.
    severity: critical
    origin: drafted
  - id: ps.s2.e3
    statement: >-
      Vise jaws clamped on the fitting threads or sealing cone, marring the sealing surface.
    severity: major
    origin: drafted
- id: ps.s3
  section: Preset the Sleeve
  text: >-
    Tighten the nut until the cutting edge of the sleeve grips the tube, turning the tube
    back and forth while tightening until it no longer turns.
  origin: drafted
  assumed: true
  note_refs:
  - 2
  checks:
  - id: ps.s3.c1
    statement: >-
      At completion the tube can no longer be rotated by hand within the sleeve.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "slowly turn the tube back and forth while tightening the nut. When the tube
      no longer turns, the nut is ready for tightening." Supplemental step, needs SME confirmation.
    assumed: true
  - id: ps.s3.c2
    statement: >-
      Tube stays bottomed firmly and squarely on the fitting seat throughout nut tightening.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "hold the tubing firmly and squarely on the seat in the fitting. (The tube
      must bottom firmly in the fitting.)" Provisional supplemental step.
    assumed: true
  - id: ps.s3.c3
    statement: >-
      Nut is stopped at the grip point, with no final-tightening turns yet applied.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook separates grip point from step 3: "the nut is ready for tightening"; final
      turns are a distinct operation. Provisional.
    assumed: true
  - id: ps.s3.c4
    statement: >-
      Tube is coaxial with the fitting and nut, not cocked or offset at the junction.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Rests on handbook "firmly and squarely on the seat in the fitting"; squareness is visible
      at the joint. Provisional supplemental step.
    assumed: true
  error_modes:
  - id: ps.s3.e1
    statement: >-
      Nut run down well past the grip point, over-presetting the sleeve while the joint still
      looks normal.
    severity: critical
    origin: drafted
  - id: ps.s3.e2
    statement: >-
      Tube not held bottomed in the seat, so the sleeve bites with the tube unseated or cocked.
    severity: critical
    origin: drafted
  - id: ps.s3.e3
    statement: >-
      Tube never rotated during tightening, so the grip point is guessed rather than found.
    severity: major
    origin: drafted
- id: ps.s4
  section: Preset the Sleeve
  text: >-
    Final-tighten the nut the number of turns specified for the tube material and outside
    diameter.
  origin: drafted
  assumed: true
  note_refs:
  - 3
  checks:
  - id: ps.s4.c1
    statement: >-
      Nut is turned the specified amount past the grip point: 1 to 1-1/6 turns for aluminum
      alloy up to 1/2" OD, 1-1/6 to 1-1/2 turns for steel or aluminum over 1/2" OD.
    observable: measurement
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "tighten the nut from 1 to 11/6 turns... tighten from 11/6 to 11/2 turns";
      step is supplemental, and the fraction is typographically suspect.
    assumed: true
  - id: ps.s4.c2
    statement: >-
      Turn count is taken from the point at which the tube no longer turns, not from finger-tight
      or first thread contact.
    observable: video
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "When the tube no longer turns, the nut is ready for tightening." Reference
      point only evidenced by watching the tightening.
    assumed: true
  - id: ps.s4.c3
    statement: >-
      Tube material and outside diameter are identified so the correct turn range can be selected.
    observable: document
    source: procedure sheet
    origin: drafted
    note: >-
      Supplemental note: "tube material and outside diameter must be known before this step
      can be graded"; provisional, needs SME confirmation.
    assumed: true
  - id: ps.s4.c4
    statement: >-
      Finished connection shows the nut drawn down squarely on the fitting body with the tube
      axially aligned and no wrench galling or rounded flats.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Workmanship expectation for the completed preset; supplemental section, not SME reviewed.
    assumed: true
  error_modes:
  - id: ps.s4.e1
    statement: >-
      Nut final-tightened less than the specified turns, so the sleeve never fully bites and
      the joint can blow off while looking correctly assembled.
    severity: critical
    origin: drafted
  - id: ps.s4.e2
    statement: >-
      Nut tightened past the maximum turns, over-deforming or collapsing the tube and setting
      up line failure.
    severity: critical
    origin: drafted
  - id: ps.s4.e3
    statement: >-
      Turns counted from finger-tight instead of from the grip point, giving an out-of-range
      preset that must be redone with a new sleeve.
    severity: major
    origin: drafted
  - id: ps.s4.e4
    statement: >-
      Wrench slippage marks, galling or rounded corners on the B-nut or fitting hex.
    severity: minor
    origin: drafted
- id: ip.s1
  section: Inspect the Preset Connection
  text: Disconnect the tubing from the fitting.
  origin: drafted
  assumed: true
  checks:
  - id: ip.s1.c1
    statement: >-
      The tube assembly is fully separated from the fitting, with the nut backed off and the
      tube end free.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "After presetting the sleeve, disconnect the tubing from the fitting and check
      the following points"; disassembly is prerequisite to inspection.
  - id: ip.s1.c2
    statement: >-
      The preset sleeve remains on the tube in its swaged position, not slid off or removed
      with the nut.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Drafted supplemental step; preset evidence is destroyed if sleeve is displaced. Inference
      needs subject-matter confirmation.
    assumed: true
  - id: ip.s1.c3
    statement: >-
      Tube end, sleeve pilot and nut/fitting threads show no gouging, galling or cross-threading
      from disassembly.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Supplemental step drafted from p.9-6 presetting sequence; handbook states no damage
      standard for disassembly. Needs SME confirmation.
    assumed: true
  - id: ip.s1.c4
    statement: >-
      Tube material and outside diameter are recorded so the correct pilot-clearance limit
      can be applied in later checks.
    observable: document
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "maximum clearance of 0.005" for aluminum alloy tubing or 0.015" for steel
      tubing" — limit depends on material/OD.
    assumed: true
  error_modes:
  - id: ip.s1.e1
    statement: >-
      Nut is re-tightened or the joint reassembled and snugged before inspection, adding turns
      and over-swaging the sleeve.
    severity: critical
    origin: drafted
  - id: ip.s1.e2
    statement: >-
      Tube is pulled or twisted out while the nut is still partially tight, bending the tube
      or shifting the sleeve pilot.
    severity: major
    origin: drafted
  - id: ip.s1.e3
    statement: >-
      Sleeve is stripped off or pushed along the tube during disassembly, destroying the preset
      evidence.
    severity: major
    origin: drafted
- id: ip.s2
  section: Inspect the Preset Connection
  text: Verify the tube extends 3/32" to 1/8" beyond the sleeve pilot.
  origin: drafted
  assumed: true
  note_refs:
  - 1
  checks:
  - id: ip.s2.c1
    statement: >-
      The tube end protrudes beyond the sleeve pilot by 3/32" to 1/8" as measured with a rule
      or caliper.
    observable: measurement
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "The tube should extend 3⁄32" to 1⁄8" beyond the sleeve pilot; otherwise,
      blowoff may occur." Step is supplemental; needs SME confirmation.
    assumed: true
  - id: ip.s2.c2
    statement: >-
      The tube, nut and sleeve are off the fitting with the sleeve pilot and tube end fully
      exposed and unobstructed.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "disconnect the tubing from the fitting and check the following points" —
      measurement is impossible with the tube seated.
    assumed: true
  - id: ip.s2.c3
    statement: >-
      Tube visibly projects past the sleeve pilot rather than sitting flush with or recessed
      behind it.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Gross condition of the handbook's "extend ... beyond the sleeve pilot" requirement;
      exact dimension still needs measuring.
    assumed: true
  - id: ip.s2.c4
    statement: >-
      The extension is measured from the sleeve pilot face, with the sleeve left in its preset
      position and not slid along the tube.
    observable: video
    source: procedure sheet
    origin: drafted
    note: >-
      Supplemental sheet places this check after presetting; a repositioned sleeve invalidates
      the reading. Needs SME confirmation.
    assumed: true
  error_modes:
  - id: ip.s2.e1
    statement: >-
      Tube extends less than 3/32" (or is flush with the pilot), leaving a plausible-looking
      joint prone to blowoff.
    severity: critical
    origin: drafted
  - id: ip.s2.e2
    statement: >-
      Extension read from the nut face or with the sleeve shifted, producing a false in-tolerance
      value.
    severity: critical
    origin: drafted
  - id: ip.s2.e3
    statement: Tube extends more than 1/8" beyond the sleeve pilot.
    severity: major
    origin: drafted
- id: ip.s3
  section: Inspect the Preset Connection
  text: >-
    Verify the sleeve pilot contacts the tube or is within the maximum clearance for the tube
    material.
  origin: drafted
  assumed: true
  note_refs:
  - 2
  checks:
  - id: ip.s3.c1
    statement: >-
      Clearance between the sleeve pilot and the tube is zero contact, or no more than 0.005"
      (aluminum alloy) / 0.015" (corrosion-resistant steel).
    observable: measurement
    source: both
    origin: drafted
    note: >-
      Handbook p.9-6: "sleeve pilot should contact the tube or have a maximum clearance of
      0.005" for aluminum alloy tubing or 0.015" for steel tubing"; step is supplemental,
      needs SME confirmation.
    assumed: true
  - id: ip.s3.c2
    statement: >-
      The tube material and outside diameter are identified so the correct clearance limit
      is selected.
    observable: document
    source: procedure sheet
    origin: drafted
    note: >-
      Supplemental step distinguishes aluminum alloy from corrosion-resistant steel limits;
      material data must be established from spec. Needs SME confirmation.
    assumed: true
  - id: ip.s3.c3
    statement: >-
      The pilot area of the tube shows no crack, split or gross collapse; only slight deformation
      at the sleeve cut is present.
    observable: photo
    source: handbook FAA-H-8083-30B p.9-6
    origin: drafted
    note: >-
      Handbook: "A slight collapse of the tube at the sleeve cut is permissible." Gross collapse
      or splitting invalidates the pilot contact judgement.
  - id: ip.s3.c4
    statement: >-
      Sleeve remains on the tube with the pilot region exposed and clean, so clearance can
      be gauged.
    observable: photo
    source: procedure sheet
    origin: drafted
    note: >-
      Supplemental inspection step requires the disconnected tube/sleeve be presented for
      pilot inspection; needs SME confirmation.
    assumed: true
  error_modes:
  - id: ip.s3.e1
    statement: >-
      Clearance judged by eye only and never gauged, so an over-clearance pilot passes while
      the assembly looks normal.
    severity: critical
    origin: drafted
  - id: ip.s3.e2
    statement: >-
      Steel limit (0.015") applied to aluminum alloy tubing, accepting a pilot gap that exceeds
