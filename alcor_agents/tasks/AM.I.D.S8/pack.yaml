evidence:
  required:
  - id: ev1
    description: >-
      The cut and deburred tube end before the nut and sleeve are installed: end face square
      to the axis, inside and outside edges free of raised burrs and ragged metal, bore clear
      of chips and abrasive grit, and no flattening or crush marks from the cutting wheel.
    medium: photo
    origin: drafted
    framing: >-
      Close, near-macro, tube end filling most of the frame at a slight oblique so both the
      end face and a short length of the bore are visible; a machinist scale or caliper jaw
      laid alongside for scale; diffuse light with no specular glare off the cut edge.
  - id: ev2
    description: >-
      The nut and sleeve staged on the tube before it enters the fitting, showing the nut
      on first (behind the sleeve) and the sleeve's cutting edge and pilot facing the tube
      end that will enter the fitting.
    medium: photo
    origin: drafted
    framing: >-
      Side elevation, tube horizontal, camera perpendicular to the tube axis, close enough
      that the sleeve's pilot and cutting-edge taper are distinguishable; plain contrasting
      background; light raking across the sleeve to reveal its profile.
  - id: ev3
    description: >-
      The completed preset connection still assembled: fitting body clamped in the vise with
      jaws clear of the threads and sealing cone, nut drawn down squarely on the fitting body,
      tube coaxial with the fitting and not cocked, and no galling or rounded flats on the
      nut.
    medium: photo
    origin: drafted
    framing: >-
      Three-quarter view at working distance showing vise jaws, fitting, nut and at least
      3" of tube in one frame; second-priority tighter view of the nut-to-fitting joint line;
      even shop lighting, no shadow across the joint.
  - id: ev4
    description: >-
      Instrumented post-disconnection inspection of the tube end: rule or caliper reading
      of tube protrusion beyond the sleeve pilot, and the gauged sleeve-pilot-to-tube clearance,
      with the tube material and outside diameter stated so the correct clearance limit can
      be applied.
    medium: measurement
    origin: drafted
    framing: >-
      Recorded reading (value and instrument) with a supporting close photo of the caliper
      or rule in place on the sleeve pilot face and tube end; sleeve left in its preset position,
      not slid along the tube.
    assumed: true
  - id: ev5
    description: >-
      Continuous capture of the tightening and retention checks: tube held bottomed and square
      on the seat, the grip point found by turning the tube back and forth until it no longer
      turns, the counted final-tightening turns taken from that point, and the hand-pressure
      check that the sleeve pilot rotates but does not slide axially on the tube.
    medium: video
    origin: drafted
    framing: >-
      Fixed or shoulder-level view of the vise, unbroken take, close enough to read a witness
      mark on the nut against the fitting for turn counting; audible or on-screen count; second
      segment close on the sleeve while axial hand pressure is applied.
    assumed: true
