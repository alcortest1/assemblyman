open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  The procedure sheet's step list ends at 'Deburr the tubing ends', yet the task title and
  the campus fit note say 'completed connection'. Does the graded submission include the presetting
  operation and the assembled joint, or only the prepared tube ends?
- >-
  Tube material and outside diameter must be fixed for the pack: they select between the 0.005"
  and 0.015" clearance limits and between the '1 to 1 1/6 turns' and '1 1/6 to 1 1/2 turns'
  final tightening ranges on p. 9-6.
- >-
  What length value, and what tolerance on it, does the work order specify? The sheet gives
  no number.
- >-
  Is a scribe or metal-marking pencil permitted for the layout mark, given the check that
  no scribe groove may remain in the tube wall?
- >-
  Should the OCR'd fraction '1 1/6 turns' on p. 9-6 be verified against the source PDF before
  any turn-count criterion is graded?
