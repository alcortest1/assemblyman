open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  The AIM procedure sheet documents no steps for 'Preset the Sleeve', 'Inspect the Preset
  Connection', yet the task title and the sheet's own equipment list call for that work. Those
  steps were drafted from the handbook and the reference video and carry `origin: drafted`.
  Confirm with AIM whether they form part of the graded submission, and ask for a corrected
  procedure sheet if they do.
- >-
  Verify the fraction rendered as "1-1/6" against the source FAA-H-8083-30B PDF (1-1/8 and
  1-1/16 are both plausible) before any turn-count criterion is graded.
- >-
  Confirm with an SME whether presetting and post-preset inspection are in scope for AM.I.D.S8
  at all, since the AIM sheet's step list ends at 'Deburr the tubing ends'.
- >-
  Fix the tube material and outside diameter used in the exercise, and require students to
  state them, or neither the turn range nor the clearance limit can be selected.
- >-
  Resolve whether the 0.015" limit applies to 'steel' (p. 9-6 body) or 'corrosion-resistant
  steel' (Fig. 9-14 caption, p. 9-8) tubing.
- >-
  Confirm whether the campus method is the fitting-in-a-vise procedure or a presetting tool,
  which p. 9-5 also permits ('preset with the proper size presetting tool or operation');
  the turn-count evidence differs.
- >-
  Set a tolerance or pass/fail wording for cut squareness and for the 'continuous witness
  ring' check, neither of which is quantified in the extract.
