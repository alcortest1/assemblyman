open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  The procedure sheet specifies a 47° flare and a 47° die; the cited handbook page 9-4 says
  the aircraft flaring tool produces "a flare of 35° to 37°" and that an automotive tool producing
  45° is impermissible. An SME must resolve which angle the assessment accepts before this
  pack is used.
- >-
  Does the blue-sleeve-ring check depend on a specific sleeve finish? It fails as a criterion
  if the shop stocks unpainted or differently coloured sleeves.
- >-
  The pressure test has no specified hold duration or allowable gauge decay; a number is needed
  for 'holds without decay' to be checkable.
- >-
  Is a double flare required? Handbook p. 9-5 states a double flare is used on soft aluminium
  alloy tubing 3/8" OD and under, which would cover the 0.25" example stock; the procedure
  sheet teaches a single flare only.
- >-
  Which document supplies the system operating pressure used to compute test pressure for
  this training article, and is it recorded on the worksheet?
