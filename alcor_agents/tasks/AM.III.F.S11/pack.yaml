open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  The approximately 6 inch hitch spacing and 8 inch starting tail are campus figures and are
  not in the cited handbook pages — confirm the governing spec or manual value before grading
  against them.
- >-
  The 3/8 inch minimum trim comes from machine-extracted figure text (Figure 9-148); confirm
  against the PDF and confirm it applies to both the starting and finishing knot tails.
- >-
  Define the pull/slide check: what hand force or method constitutes a pass, and whether it
  is instructor-witnessed or student-recorded.
- >-
  Confirm whether the intermediate knots are to be graded as half hitches (handbook Figure
  9-148 Step B labels them "intermediate half hitches") given the procedure sheet says only
  "tie a hitch".
