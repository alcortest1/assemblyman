open_questions:
- >-
  Every check, error mode and evidence item in this pack was drafted by packs/compile_pack.py
  from the procedure sheet and handbook, and has not been reviewed by a subject-matter expert.
- >-
  Does this task end at the verified cut, or does the assessed artifact include MS fitting
  assembly per Figure 9-35 (socket screwed on counterclockwise, .005"-.031" clearance between
  nipple hex and socket)? The step list stops at cutting while the fit note says 'completed
  fabrication'.
- >-
  The handbook states all flexible hose must be proof-tested after assembly and recommends
  testing to at least 1.5 system pressure; must the student produce a proof-test record, and
  on what stand?
- >-
  No numeric tolerance for cut-face squareness or maximum braid splay appears in either the
  procedure sheet or the extract — an SME must set a pass threshold before graders can apply
  the 'square and clean' conditions consistently.
- >-
  Which value within 5-8 percent should be used, and is any rounding rule applied? The worked
  example in Note 1 uses 1.9" on 24", roughly 7.9 percent.
- >-
  Figure 9-35 step 2 (slit cover to wire braid and twist off) is noted as applying to high-pressure
  hose only; does the training hose fall in that class, and if so should cover removal be
  evidenced?
- >-
  Should the dash-number match be verified against the mating tubing size as the handbook
  frames it, in addition to the hose-to-fitting match the procedure sheet requires?
